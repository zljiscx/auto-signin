{% extends "base.html" %}
{% block title %}初始化设置 - 自动签到系统{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 80px auto;">
    <h2 style="text-align: center; margin-bottom: 25px;">首次使用初始化</h2>
    <p style="text-align: center; color: #909399; margin-bottom: 20px;">请设置管理员登录密码</p>
    <form method="post">
        <div class="form-group">
            <label>管理员密码</label>
            <input type="password" name="password" required placeholder="请输入密码（不少于6位）">
        </div>
        <div class="form-group">
            <label>确认密码</label>
            <input type="password" name="confirm_password" required placeholder="请再次输入密码">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">完成设置</button>
    </form>
</div>
{% endblock %}
